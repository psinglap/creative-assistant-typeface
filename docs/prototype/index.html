<style>

}

 --amb:#DFAD59;--ambS:#241B0E;--ambL:#44351F;--grn:#5EC0A5;--grnS:#0F201C;--grnL:#1F3E36;
 --vio:#A99BE0;--vioS:#1A1826;--vioL:#2F2A45;--sh:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28);}}
:root[data-theme="dark"]{
 --bg:#0E0F12;--pane:#16181C;--p2:#1B1D22;--p3:#23262B;--board:#121317;
 --ink:#EDEEF0;--i2:#A0A3AA;--i3:#767980;--line:#282B31;--l2:#383C43;
 --acc:#FF5E6B;--accS:#2A1518;--accL:#4E2126;--red:#F5828E;--redS:#2A1418;--redL:#4C2027;
 --amb:#DFAD59;--ambS:#241B0E;--ambL:#44351F;--grn:#5EC0A5;--grnS:#0F201C;--grnL:#1F3E36;
 --vio:#A99BE0;--vioS:#1A1826;--vioL:#2F2A45;--sh:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28);}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}

p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--i3)}

/* shell */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.bar{display:flex;align-items:center;gap:12px;padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:var(--pane);border-bottom:1px solid var(--line)}

.ib{border:1px solid var(--l2);border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:600;text-align:center}

.ib.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.split{display:grid;grid-template-columns:236px minmax(0,1fr) 380px;min-height:0;transition:grid-template-columns .16s ease}
@media (min-width:1061px){
 .split.ns{grid-template-columns:0 minmax(0,1fr) 380px}
 .split.nc{grid-template-columns:236px minmax(0,1fr) 0}
 .split.ns.nc{grid-template-columns:0 minmax(0,1fr) 0}
}
.split.ns .side,.split.nc .chat{opacity:0;pointer-events:none;overflow:hidden;max-height:0;padding:0;border:0}

.tgl{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:13px;color:var(--i2);border:1px solid transparent}
.tgl:hover{background:var(--p3);color:var(--ink)}

/* floating canvas toolbar, Figma style */
.fbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:3px;
 background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.12);z-index:22}

.fbar button:hover{background:var(--p3);color:var(--ink)}
.fbar .pct{font-family:var(--mono);font-size:11px;min-width:40px;text-align:center;color:var(--i2)}
.fbar .sv{width:1px;height:16px;background:var(--line);margin:0 4px}
.fbar .st{display:flex;align-items:center;gap:5px;padding:0 8px;font-size:11px;color:var(--i2);white-space:nowrap}
.fbar .st i{width:7px;height:7px;border-radius:50%}

/* filter pill, only when a category is active */
.fpill{position:absolute;left:16px;top:16px;display:flex;align-items:center;gap:8px;background:var(--pane);
 border:1px solid var(--accL);border-radius:9px;padding:7px 9px 7px 12px;box-shadow:var(--sh);z-index:22;font-size:12px}
.fpill b{font-weight:600;color:var(--acc)}
.fpill .n{font-family:var(--mono);font-size:10.5px;color:var(--i3)}
.fpill button{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--i3);font-size:13px}
.fpill button:hover{background:var(--p3);color:var(--ink)}

/* category rollup inside a chat message */
.crol{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.crol button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11px;background:var(--p2);white-space:nowrap}
.crol button:hover{border-color:var(--acc);background:var(--accS)}
.crol button[aria-pressed="true"]{border-color:var(--acc);background:var(--accS);font-weight:600}
.crol button.na{opacity:.42}
.crol .dt{width:6px;height:6px;border-radius:50%;flex:none}
.crol .n{font-family:var(--mono);font-size:9.5px;color:var(--i3)}
.im.nk{background:linear-gradient(150deg,#1b1d22 0%,#2f343c 52%,#14161a 100%)}
.im.nk.alt{background:linear-gradient(150deg,#3a1220 0%,#6d2033 52%,#25101a 100%)}
.shoe{position:absolute;border-radius:46% 52% 34% 22%/62% 58% 42% 38%;
 background:linear-gradient(120deg,#d8ff3e 0%,#b8e02a 44%,#1e2127 46%,#0f1114 100%);
 box-shadow:0 3px 10px rgba(0,0,0,.42)}
.shoe.crop{border-radius:46% 0 0 22%/62% 0 0 38%;clip-path:inset(0 22% 0 0)}
.shoe.lace{background:linear-gradient(120deg,#d8ff3e 0%,#b8e02a 30%,#8a9a44 36%,#c9d94e 41%,#1e2127 47%,#0f1114 100%);
 filter:blur(.3px) contrast(1.15)}
.lg.nkl{position:absolute;background:#fff;
 clip-path:polygon(0% 78%,14% 86%,100% 0%,36% 100%,4% 92%);opacity:.95}
.hd2.nkh{color:#fff;font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1.05;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.ct.nkc{position:absolute;background:#d8ff3e;color:#15171b;font-weight:700;border-radius:99px;white-space:nowrap}
.grp{position:absolute;border:1px dashed var(--l2);border-radius:8px;pointer-events:none}
.grp .gl{position:absolute;left:8px;top:-8px;background:var(--bg);padding:0 6px;
 font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--i3);white-space:nowrap}
.cell{position:absolute}
.cbub{position:absolute;transform-origin:0 0;width:22px;height:22px;border-radius:50%;z-index:6;
 display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;
 background:var(--pane);color:var(--i3);border:1px solid var(--l2);box-shadow:0 1px 4px rgba(0,0,0,.14);
 opacity:0;transition:opacity .12s,color .12s,border-color .12s;cursor:pointer}
.cell:hover .cbub,.cbub.on,.cbub:focus-visible{opacity:1}
.cbub:hover,.cbub.on{color:var(--acc);border-color:var(--acc);background:var(--accS)}
.pinbox{position:absolute;transform-origin:0 0;z-index:30;width:268px;background:var(--pane);
 border:1px solid var(--l2);border-radius:11px;box-shadow:0 8px 28px rgba(0,0,0,.18);overflow:hidden;text-align:left}
.pinbox .ph{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--p2);border-bottom:1px solid var(--line)}
.pinbox .pdt{width:7px;height:7px;border-radius:50%;flex:none}
.pinbox .ph b{font-size:11.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinbox .pn{font-family:var(--mono);font-size:9px;color:var(--i3);flex:none}
.pinbox .px{color:var(--i3);font-size:15px;line-height:1;padding:0 2px;flex:none}
.pinbox .px:hover{color:var(--ink)}
.pinbox .pw{font-size:11.5px;color:var(--i2);line-height:1.4;padding:9px 10px 0}
.pinbox .pw.ok2{color:var(--grn)}
.pinbox .pi{display:flex;align-items:center;gap:6px;margin:9px 10px;padding:4px 4px 4px 8px;
 border:1px solid var(--l2);border-radius:8px;background:var(--p2)}
.pinbox .pi .at{font-family:var(--mono);font-size:9px;color:var(--acc);font-weight:700;flex:none}
.pinbox .pi input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:11.5px;color:var(--ink);outline:0}
.pinbox .pi button{background:var(--ink);color:var(--bg);border-radius:5px;width:22px;height:22px;flex:none;display:grid;place-items:center;font-size:11px}
.pinbox .pq{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 10px}
.pqb{font-size:10px;color:var(--i2);border:1px solid var(--line);border-radius:99px;padding:3px 8px;background:var(--pane)}
.pqb:hover{border-color:var(--acc);color:var(--acc);background:var(--accS)}
.amq{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.amb{font-size:11px;padding:5px 10px;text-align:left}
.amb.act{border-color:var(--accL);color:var(--acc);background:var(--accS);font-weight:600}
.seeall{margin-top:9px;border-style:dashed}
.cd.fixing{animation:pulse 1.1s ease-in-out infinite}
.cd.justfixed{animation:pop .45s ease-out}

 pointer-events:none;animation:ring .5s ease-out forwards}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accS)}50%{box-shadow:0 0 0 3px var(--accS)}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes ring{0%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
 .cd.fixing,.cd.justfixed,.cd.justfixed:after,.ri.go{animation:none}
}
.zlo .cdcap{display:none}
.inf{width:17px;height:17px;border-radius:50%;border:0;background:var(--p3);color:var(--i2);

.pop{position:absolute;right:0;top:calc(100% + 7px);z-index:40;width:290px;display:grid;gap:7px;
 background:var(--pane);border:1px solid var(--l2);border-radius:10px;padding:11px 12px;box-shadow:var(--sh)}
.pop.wide{width:320px}

.pop i{width:8px;height:8px;border-radius:50%;margin-top:4px}
.pop b{color:var(--ink);font-weight:600}
.hsep{display:inline-block;width:1px;height:12px;background:var(--line);margin:0 10px;vertical-align:-2px}
.hfx{font-size:12px;color:var(--acc);font-weight:500}
.hfx.zero{color:var(--i3);font-weight:400}
.pbody{padding:14px}
.pfoot{border-top:1px solid var(--line);padding:9px 12px;display:grid;gap:6px;background:var(--pane)}
.pfoot .ib{font-size:11.5px;padding:9px 11px;justify-content:center;white-space:nowrap;width:100%}
.ib.q{background:none;border:1px solid var(--line);color:var(--i2);font-weight:500}
.ib.q:hover{border-color:var(--acc);color:var(--acc);background:var(--accS)}
.num3{position:relative;display:flex;gap:16px;align-items:center;margin:11px 0 2px;padding:10px 12px;background:var(--p2);border:1px solid var(--line);border-radius:9px}
.key{display:grid;gap:5px;margin-top:9px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--pane)}
.key div{display:grid;grid-template-columns:8px 1fr;gap:9px;align-items:start;font-size:11px;color:var(--i2);line-height:1.45}
.key i{width:8px;height:8px;border-radius:50%;margin-top:4px}
.key b{color:var(--ink);font-weight:600}
.n3{font-size:10.5px;color:var(--i2);line-height:1.3}
.n3 b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em}
.n3.r b{color:var(--red)}.n3.a b{color:var(--amb)}.n3.g b{color:var(--grn)}
.lead{font-size:12.5px;line-height:1.5;color:var(--i2)}

.sub{font-size:11.5px;color:var(--i2);margin-top:9px;line-height:1.5}
.sec2{font-family:var(--mono);font-size:9px;letter-spacing:.07em;color:var(--i3);margin:16px 0 7px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.acts .ib{font-size:11.5px;padding:6px 11px}
.chk{margin-top:12px;border-top:1px solid var(--line);padding-top:9px}
.chk summary{font-family:var(--mono);font-size:9.5px;color:var(--i3);letter-spacing:.05em;cursor:pointer;list-style:none}
.chk summary::-webkit-details-marker{display:none}
.chk summary:before{content:"\25B8 ";display:inline-block;transition:transform .12s}
.chk[open] summary:before{transform:rotate(90deg)}
.chk summary:hover{color:var(--ink)}
.crow{width:100%;display:grid;grid-template-columns:7px 1fr auto;gap:9px;align-items:center;text-align:left;
 padding:9px 11px;margin-top:5px;border:1px solid var(--line);border-radius:8px;background:var(--pane);font-size:12px}
.crow:hover{border-color:var(--acc);background:var(--accS)}
.crow .dt{width:7px;height:7px;border-radius:50%}
.crow .nm{font-weight:600}

@media (max-width:1060px){.split{grid-template-columns:200px minmax(0,1fr)}.chat{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);height:54vh}}
@media (max-width:1060px){#tgS,#tgC,.sv2{display:none}}
@media (max-width:820px){body{overflow:auto}.app{height:auto}.split{grid-template-columns:1fr}
 .side{border-right:0;border-bottom:1px solid var(--line)}.mid{min-height:70vh}}

/* ---- sidebar ---- */
.side{background:var(--pane);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:18px}
.snav{display:flex;flex-direction:column;gap:1px}
.nv{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;font-size:13px;color:var(--i2);font-weight:500;width:100%}
.nv:hover{background:var(--p3);color:var(--ink)}
.nv[aria-pressed="true"]{background:var(--p3);color:var(--ink);font-weight:600}
.nv .ico{width:15px;text-align:center;font-size:12px;opacity:.7;flex:none}
.sgrp{display:flex;flex-direction:column;gap:2px}
.sgh{padding:0 9px 6px}
.sgh .lbl{font-size:9px;letter-spacing:.08em}
.cmp{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:13px;font-weight:500;width:100%}
.cmp:hover{background:var(--p3)}
.cmp[aria-pressed="true"]{background:var(--p3);font-weight:600}
.cmp .dt{width:7px;height:7px;border-radius:50%;flex:none}

.cmp .ct{font-family:var(--mono);font-size:10.5px;color:var(--i3);flex:none}
.th:hover{background:var(--p3);color:var(--ink)}
.th[aria-pressed="true"]{background:var(--p3);color:var(--ink);font-weight:600}
.th[aria-pressed="true"] .rg{background:var(--acc);border-color:var(--acc)}

/* ---- middle ---- */
.mid{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.mh{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--pane);flex-wrap:wrap}
.mh h2{font-size:15px;font-weight:600}
.mh .sub{font-size:11.5px;color:var(--i3)}
.mh .rt{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mb{flex:1;overflow-y:auto;min-height:0}
.mb.grid{background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/24px 24px,var(--board)}
.pad{padding:22px;max-width:1080px;margin:0 auto}

/* status pills */
.pl{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap}
.pl.g{color:var(--grn);background:var(--grnS);border-color:var(--grnL)}
.pl.a{color:var(--amb);background:var(--ambS);border-color:var(--ambL)}
.pl.r{color:var(--red);background:var(--redS);border-color:var(--redL)}
.pl.n{color:var(--i2);background:var(--p3);border-color:var(--line)}

/* ---- overview ---- */

.ccard{background:var(--pane);border:1px solid var(--line);border-radius:14px;padding:17px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.ccard .top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ccard h3{font-size:15px;font-weight:600}
.ccard .meta{font-size:11.5px;color:var(--i3);margin-top:3px}
.ccard .act{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* ---- canvas ---- */
.vp{position:relative;flex:1;overflow:hidden;min-height:0;cursor:grab;
 background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/24px 24px,var(--board)}
.vp.drag{cursor:grabbing}
.board{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.plat{position:absolute;border:1px solid var(--line);border-radius:14px;background:var(--pane)}
.plat>.hd{position:absolute;left:0;right:0;top:-34px;display:flex;align-items:center;gap:9px;padding:0 4px}
.plat>.hd b{font-size:14px;font-weight:600;white-space:nowrap}
.plat>.hd .lbl{white-space:nowrap}
.plat>.hd .pl{flex:none}
.fmrow{position:absolute}

var FMT={"9:16":9/16,"4:5":4/5,"1:1":1,"16:9":16/9};
function ar(f){if(FMT[f])return FMT[f];var m=f.split("x");return (+m[0])/(+m[1])}
function slotSize(f){
 var a=ar(f);
 if(a>=2.2){var w=Math.min(360,190*a);return {w:Math.round(w),h:Math.round(w/a)}}
 if(a<=.42){var hh=210;return {w:Math.round(hh*a),h:hh}}
 return {w:Math.round(190*a),h:190};
}
function mkCamp(id,name,mkt,plats){
 var iss=mkt==="jp"?issuesJP():mkt==="nk"?issuesNK():issuesUS(),vs=[],total=0,seed=id.length*7+3;
 plats.forEach(function(p){
  p.fmts.forEach(function(f){
   for(var i=0;i<f.n;i++){
    total++;
    vs.push({id:id+"-"+p.k+"-"+f.f.replace(":","x")+"-"+(i+1),plat:p.k,fmt:f.f,cls:[],
             fn:id+"_"+p.k.toLowerCase()+"_"+f.f.replace(":","x")+"_v"+(i+1)+".png"});
   }
  });
 });
 iss.forEach(function(c,ci){
  var want=Math.min(c.n,total); c.n=want;
  var step=Math.max(1,Math.floor(total/Math.max(1,want))),k=0,i;
  for(i=(ci*2)%step;i<total&&k<want;i+=step,k++)vs[i].cls.push(c.id);
  for(i=0;i<total&&k<want;i++)if(vs[i].cls.indexOf(c.id)<0){vs[i].cls.push(c.id);k++}
 });
 return {id:id,name:name,mkt:mkt,plats:plats,issues:iss,variants:vs,total:total};
}

/* ---------------- canvas: platform sections ---------------- */
var CH=190,GAP=26,ROWGAP=56,GRPGAP=30,SECGAP=86,PAD=22,TARGET=1120;
function layout(c){
 var secs=[],y=0;
 c.plats.forEach(function(p){
  var grps=[],gy=PAD+26,cur=null;
  p.fmts.forEach(function(f){
   var gname=f.grp||"";
   if(!cur||cur.name!==gname){cur={name:gname,y:gy,rows:[],h:0};grps.push(cur);gy+=gname?22:0}
   var sz=slotSize(f.f),w=sz.w,hh=sz.h;
   var per=Math.max(1,Math.min(8,Math.floor((TARGET-PAD*2)/(w+GAP))));
   var vs=c.variants.filter(function(v){return v.plat===p.k&&v.fmt===f.f});
   if(vs.length<per)per=vs.length||1;
   var cells=vs.map(function(v,k){return {v:v,x:PAD+12+(k%per)*(w+GAP),y:gy+Math.floor(k/per)*(hh+30+GAP),w:w,h:hh}});
   var nr=Math.ceil(vs.length/per);
   var rh=nr*(hh+30+GAP)-GAP;
   cur.rows.push({f:f.f,n:vs.length,y:gy,cells:cells,h:rh,w:Math.min(vs.length,per)*(w+GAP)-GAP});
   gy+=rh+ROWGAP; cur.h=gy-ROWGAP-cur.y;
  });
  grps.forEach(function(g,gi){if(gi<grps.length-1)g.h=g.h});
  gy=PAD+26; var rebuilt=[];
  grps.forEach(function(g){
   var shift=gy-g.y;
   g.y+=shift; g.rows.forEach(function(r){r.y+=shift;r.cells.forEach(function(cl){cl.y+=shift})});
   gy=g.y+g.h+GRPGAP; rebuilt.push(g);
  });
  grps=rebuilt;
  var rows=[];grps.forEach(function(g){g.rows.forEach(function(r){rows.push(r)})});
  var sw=Math.max.apply(null,rows.map(function(r){return r.w}))+PAD*2+24;
  var sh=gy-GRPGAP+PAD;
  secs.push({p:p,y:y,w:sw,h:sh,rows:rows,grps:grps});
  y+=sh+SECGAP;
 });
 return {secs:secs,w:Math.max.apply(null,secs.map(function(s){return s.w})),h:y};
}
/* resolved for THIS variant: either the whole finding is done, or this card is already through the run */
function res(c,v,id){
 if(dn(c)[id])return true;
 return !!(S.run&&S.run.pv&&S.run.pv[v.id+"|"+id]);
}
function inCat(c,v,k){
 var ids=catIss(c,k).map(function(x){return x.id});
 return v.cls.some(function(id){return ids.indexOf(id)>-1});
}
function card(c,v,w,h){
 var st=vStat(c,v),u=Math.min(h,w)/190;
 var dim=(S.filter&&S.filter!==st)
   ||(S.iss&&v.cls.indexOf(S.iss)<0)
   ||(!S.iss&&S.cat&&!inCat(c,v,S.cat));
 var open=v.cls.filter(function(id){return !res(c,v,id)});
 var thin=h<70||w<90;
 var live=S.run&&S.run.state==="running"&&S.run.steps[S.run.i];
 var mine=live&&v.cls.indexOf(S.run.steps[S.run.i].id)>-1;
 var flash=mine&&S.run.pv[v.id+"|"+S.run.steps[S.run.i].id];
 var att='<button class="cd '+st+(dim?" dim":"")+(S.sel===v.id?" sel":"")+(c.mkt==="nk"?" nk":"")

  +'style="left:0;top:0;width:'+w+'px;height:'+h+'px" title="'+v.plat+' '+v.fmt+'">';

 if(c.mkt==="nk"){
  var cw=v.cls.indexOf("nkcw")>-1&&!res(c,v,"nkcw");

  return att
   +'<div class="im nk'+(cw?" alt":"")+'"></div>'

     +(wide?'left:6%;width:'+(h*1.5)+'px;height:'+(h*.62)+'px;bottom:8%':'left:50%;transform:translateX(-50%);width:'+(w*.74)+'px;height:'+(w*.3)+'px;bottom:'+(thin?18:30)+'%')+'"></div>'

   +(thin?'':'<div class="ct nkc" style="right:'+(8*u)+'px;bottom:'+(10*u)+'px;padding:'+(2.5*u)+'px '+(7*u)+'px;font-size:'+Math.max(5,7*u)+'px">'+esc(cta)+'</div>')
   +'<div class="cr"><div class="tg"></div><div class="bg2"></div></div>'+bdg+'</button>';
 }
 var jp=c.mkt==="jp",ovO=v.cls.indexOf("ov")>-1&&!res(c,v,"ov"),gl=v.cls.indexOf("glyph")>-1&&!res(c,v,"glyph");
 var hd2=jp?(gl?"\u25a1\u25a1\u25a1\u25a1\u25a1\u25a1":"\u4e8c\u5341\u30b0\u30e9\u30e0\u306e\u30bf\u30f3\u30d1\u30af\u8cea"):(ovO?"Zwanzig Gramm Protein, nichts Kuenstliches":"20g Protein, nichts Kuenstliches");
 var narrow=w/h<.8;
 return att
  +'<div class="im"></div>'
  +'<div class="pk" style="left:50%;transform:translateX(-50%);top:38%;width:'+(h*.15)+'px;height:'+(h*.27)+'px"></div>'
  +'<div class="lg" style="left:'+(7*u)+'px;top:'+(6*u)+'px;font-size:'+(8*u)+'px">HALO</div>'
  +'<div class="hd2'+(ovO?" ov":"")+'" style="left:'+(7*u)+'px;right:'+((narrow?26:18)*u)+'px;bottom:'+(46*u)+'px;font-size:'+(11*u)+'px;max-height:'+((ovO?34:52)*u)+'px">'+esc(hd2)+'</div>'
  +'<div class="ct'+((res(c,v,"ctr")||jp)?" ok":"")+'" style="left:'+(7*u)+'px;bottom:'+(22*u)+'px;padding:'+(2.5*u)+'px '+(7*u)+'px;font-size:'+(8*u)+'px">'+(jp?"\u4eca\u3059\u3050":"Jetzt kaufen")+'</div>'
  +'<div class="cr"><div class="tg"></div><div class="bg2"></div></div>'+bdg+'</button>';
}

function applyView(){var b=document.getElementById("bd");
 if(b){b.style.transform="translate("+VIEW.x+"px,"+VIEW.y+"px) scale("+VIEW.z+")";
  b.className="board"+(VIEW.z<.62?" zlo":"")}
 var z=document.getElementById("zp");if(z)z.textContent=Math.round(VIEW.z*100)+"%"}
function fitView(){
 var vp=$("#vp");if(!vp||!S._L)return;
 var pad=44,aw=vp.clientWidth-(S.sel?300:0)-pad*2,ah=vp.clientHeight-pad*2;
 VIEW.z=Math.max(.1,Math.min(aw/S._L.w,ah/S._L.h,1));
 VIEW.x=pad+Math.max(0,(aw-S._L.w*VIEW.z)/2);VIEW.y=pad+Math.max(0,(ah-S._L.h*VIEW.z)/2);
 applyView();
}
function setZoom(nz,cx,cy){
 var vp=$("#vp");if(!vp)return;
 nz=Math.max(.1,Math.min(3,nz));
 var r=vp.getBoundingClientRect(),px=(cx==null?r.width/2:cx-r.left),py=(cy==null?r.height/2:cy-r.top);
 var wx=(px-VIEW.x)/VIEW.z,wy=(py-VIEW.y)/VIEW.z;
 VIEW.z=nz;VIEW.x=px-wx*nz;VIEW.y=py-wy*nz;applyView();
}
function zoomTo(id,z){
 var vp=$("#vp");if(!vp||!S._L)return;var hit=null;
 S._L.secs.forEach(function(s){s.rows.forEach(function(r){r.cells.forEach(function(cl){if(cl.v.id===id)hit={s:s,cl:cl}})})});
 if(!hit)return;
 var cx=hit.cl.x+hit.cl.w/2,cy=hit.s.y+hit.cl.y+hit.cl.h/2;
 VIEW.z=z;VIEW.x=(vp.clientWidth-(S.sel?300:0))/2-cx*z;VIEW.y=vp.clientHeight/2-cy*z;applyView();
}

function catBehav(c,k){
 var open=catIss(c,k).filter(function(x){return !dn(c)[x.id]});
 var b={autoN:0,needN:0,flagN:0,designN:0,sentN:0,open:open};
 open.forEach(function(x){
  var d=disp(c,x).k;
  if(d==="auto")b.autoN+=x.n;
  else if(d==="flag")b.flagN+=x.n;
  else if(d==="design")b.designN+=x.n;
  else if(d==="sent")b.sentN+=x.n;
  else b.needN+=x.n;
 });
 return b;
}
function behavWord(b){
 var p=[];
 if(b.autoN)p.push(b.autoN+" I can fix");
 if(b.needN)p.push(b.needN+" need your approval");
 if(b.flagN)p.push(b.flagN+" flagged for your eyes");
 if(b.designN)p.push(b.designN+" need the designer");
 if(b.sentN)p.push(b.sentN+" with "+DESIGNER);
 if(p.length===1&&b.autoN)return "I can fix all "+b.autoN;
 return p.join(" \u00b7 ");
}
function statusPane(){

function tickRun(){
 var r=S.run; if(!r||r.state!=="running")return;
 if(r.i>=r.steps.length){
  r.state="done"; S.iss=null; S.cat=null; renderAll(); toast(r.appliedN+" variants changed"); return;
 }
 var st=r.steps[r.i]; st.s="doing";
 /* light the variants this step touches, dim the rest */
 S.iss=st.id; S.cat=null;
 renderAll();
 var per=Math.max(110,Math.min(300,1600/st.n));
 r.timer=setInterval(function(){
  if(!S.run||S.run.state!=="running"){clearInterval(r.timer);return}
  var vid=st.vs[st.p];
  if(vid)r.pv[vid+"|"+st.id]=1;
  st.p++;
  renderChat(); liveCanvas();
  if(st.p>=st.n){
   clearInterval(r.timer); st.s="done"; r.appliedN+=st.n;
   var c=CAMPS.filter(function(k){return k.id===r.camp})[0];
   dn(c)[st.id]=true;
   r.i++;
   setTimeout(tickRun,300);
  }
 },per);
}
function stopRun(){
 var r=S.run; if(!r||r.state!=="running")return;
 clearInterval(r.timer);
 r.steps.forEach(function(st){if(st.s==="doing"){st.s="skip";st.p=0}else if(st.s==="wait")st.s="skip"});
 r.pv={}; r.state="stopped"; S.iss=null; S.cat=null;
 renderAll(); toast("Stopped. "+r.appliedN+" variants changed.");
}

 document.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){

 }});
 document.querySelectorAll("[data-iss]").forEach(function(b){b.onclick=function(){

  }

 document.querySelectorAll("[data-ask]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();var c=CMP(),x=IS(c,b.dataset.ask);if(!x)return;

 document.querySelectorAll("[data-goto]").forEach(function(b){b.onclick=function(e){

 document.querySelectorAll("[data-openx]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();var id=b.getAttribute("data-openx");
  S.openf=(S.openf===id?null:id);renderAll();
 }});
 document.querySelectorAll("[data-runcat]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();
  var parts=b.getAttribute("data-runcat").split("|"),cid=parts[0],k=parts[1];
  var c=CAMPS.filter(function(z){return z.id===cid})[0];
  var l=catIss(c,k).filter(function(x){return !dn(c)[x.id]&&disp(c,x).k==="auto"});
  if(!l.length)return;
  S.chats[S.camp]=S.chat; S.camp=cid; S.nav="canvas"; S.catAll=null; S.cat=k; VIEW.init=false;
  S.chat=S.chats[cid]||[];
  startRun(l,"Fixing "+esc(k)+" in "+esc(c.name)+" \u00b7 "+l.reduce(function(t,x){return t+x.n},0)+" variants");
 }});
 var ca=$("#clrall");if(ca)ca.onclick=function(){S.catAll=null;renderAll()};
 document.querySelectorAll("[data-send]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();
  var c=CMP(),x=IS(c,b.getAttribute("data-send")); if(!x)return;
  var vs=c.variants.filter(function(v){return v.cls.indexOf(x.id)>-1});
  S.sent[c.id][x.id]={when:"just now",n:vs.length};
  S.iss=x.id; S.cat=x.cls; S.ctx=x.id; S.ctxv=null; S.tab="chat";
  S._seeding=true;
  say('<div class="handoff">'
   +'<div class="hh"><span class="av">'+esc(DESIGNER.slice(0,1))+'</span>'
   +'<span><b>Sent to '+esc(DESIGNER)+'</b><span class="hr">brand design \u00b7 notified just now</span></span></div>'
   +'<div class="hb">'
   +'<p class="hl">WHAT THEY SEE</p>'
   +'<ul><li><b>'+esc(x.t)+'</b></li>'
   +'<li>'+vs.length+' variants highlighted in '+esc(c.name)+', across '+
     (function(){var p={};vs.forEach(function(v){p[v.plat]=1});return Object.keys(p).join(", ")})()+'</li>'
   +'<li>The rule: '+esc(x.au)+'</li>'
   +'<li>Your note: none. They can open the same canvas and see exactly these cards lit.</li></ul>'
   +'</div></div>'
   +'<p class="sub2b">It stays <b>with the designer</b> until they change it or hand it back. It does not block the rest of the campaign.</p>');
  S._seeding=false;
  renderAll(); toast("Sent to "+DESIGNER);
 }});
 document.querySelectorAll("[data-recall]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();
  var c=CMP(),x=IS(c,b.getAttribute("data-recall")); if(!x)return;
  delete S.sent[c.id][x.id];
  S._seeding=true;
  say('<p>Taken back from '+esc(DESIGNER)+'. It is your call again, and their notification is withdrawn.</p>');
  S._seeding=false;
  renderAll(); toast("Withdrawn");
 }});
 var sa=$("#seeall");if(sa)sa.onclick=function(){
  S._seeding=true;say(askMenu());S._seeding=false;renderAll();
 };
 document.querySelectorAll("[data-pq2]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();send(b.getAttribute("data-pq2"));
 }});
 document.querySelectorAll("[data-bub]").forEach(function(b){
  var go=function(e){e.stopPropagation();e.preventDefault();
   var id=b.getAttribute("data-bub");
   S.pin=(S.pin===id?null:id); S.sel=null;
   renderMid();wire();
   var pi=$("#pci");if(pi)pi.focus();
  };
  b.onclick=go; b.onkeydown=function(e){if(e.key==="Enter"||e.key===" ")go(e)};
 });
 var pinSend=function(txt){
  var c=CMP(),vid=S.pin; if(!vid)return;
  var v=c.variants.filter(function(z){return z.id===vid})[0]; if(!v)return;
  S.ctxv=vid; S.ctx=null; S.catAll=null; S.pin=null; S.tab="chat";
  send(txt);
 };
 var px=document.querySelector("[data-pinx]");
 if(px)px.onclick=function(e){e.stopPropagation();S.pin=null;renderMid();wire()};
 var pcs=$("#pcs"),pci=$("#pci");
 if(pcs)pcs.onclick=function(e){e.stopPropagation();var t=pci?pci.value.trim():"";if(t)pinSend(t)};
 if(pci){
  pci.onclick=function(e){e.stopPropagation()};
  pci.onkeydown=function(e){
   e.stopPropagation();
   if(e.key==="Enter"){var t=pci.value.trim();if(t)pinSend(t)}
   if(e.key==="Escape"){S.pin=null;renderMid();wire()}
  };
 }
 document.querySelectorAll("[data-pq]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();pinSend(b.getAttribute("data-pq"));
 }});
 document.querySelectorAll("[data-talkv]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();
  var c=CMP(),vid=b.getAttribute("data-talkv");
  var v=c.variants.filter(function(z){return z.id===vid})[0]; if(!v)return;
  S.ctxv=vid; S.ctx=null; S.catAll=null; S.sel=vid; S.tab="chat";
  var open=v.cls.filter(function(id){return !res(c,v,id)}).map(function(id){return IS(c,id)});
  var h='<p><b>'+esc(v.plat)+' '+esc(v.fmt)+'</b> \u00b7 <span class="mono" style="font-size:11px;color:var(--i3)">'+esc(v.fn)+'</span></p>';
  if(!open.length)h+='<div class="ok"><b>\u2713 Nothing open on this one.</b> Every check it was eligible for passed, or I already fixed it.</div>';
  else {
   h+='<p class="sub">'+open.length+' finding'+(open.length>1?"s":"")+' on this creative.</p>';
   open.forEach(function(x){h+=findingCard(c,x)});
  }
  h+='<p class="sub2b">Ask me anything about this one, or say <b>@typeface fix this</b>.</p>';
  S._seeding=true; say(h); S._seeding=false;
  renderAll(); var ci=$("#ci"); if(ci)ci.focus();
 }});
 document.querySelectorAll("[data-talk]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();
  var c=CMP(),x=IS(c,b.getAttribute("data-talk"));if(!x)return;
  S.ctx=x.id; S.tab="chat"; S.cat=x.cls;
  S._seeding=true;
  say(findingCard(c,x)+'<p class="sub2b">Ask me <i>why</i>, <i>which ones</i>, or tell me to fix it.</p>');
  S._seeding=false;
  renderAll(); var ci=$("#ci"); if(ci)ci.focus();
 }});
 var cr=$("#cancelr");if(cr)cr.onclick=function(){
  S.await=null;S.iss=null;S.cat=null;S.ctx=null;
  S._seeding=true;say('<p>Left it open. Nothing recorded.</p>');S._seeding=false;
  renderAll();
 };
 var cxx=$("#ctxx");if(cxx)cxx.onclick=function(){S.ctx=null;S.ctxv=null;S.cat=null;S.catAll=null;S.iss=null;renderAll()};
 document.querySelectorAll("[data-openf]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();var id=b.getAttribute("data-openf");
  S.openf=(S.openf===id?null:id);renderAll();
 }});
 document.querySelectorAll("[data-fixcat]").forEach(function(b){
  b.onclick=function(e){
   e.stopPropagation();e.preventDefault();
   var k=b.getAttribute("data-fixcat"),c=CMP();
   var l=catIss(c,k).filter(function(x){return !dn(c)[x.id]&&disp(c,x).k==="auto"});
   if(l.length)startRun(l,"Fixing "+esc(k)+" \u00b7 "+l.reduce(function(a2,x){return a2+x.n},0)+" variants");
  };
  b.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();b.onclick(e)}};
 });
 var fa=$("#fixall");if(fa)fa.onclick=function(){
  var c=CMP(),l=autoIss(c);
  startRun(l,"Fixing "+l.reduce(function(a2,x){return a2+x.n},0)+" variants");
 };
 var cstop=$("#cstop");if(cstop)cstop.onclick=function(){stopRun()};
 document.querySelectorAll("[data-ovr]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();overrideModal(CMP(),IS(CMP(),b.getAttribute("data-ovr")));
 }});
 document.querySelectorAll("[data-undo]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();var c=CMP(),x=IS(c,b.getAttribute("data-undo"));
  delete dn(c)[x.id];renderAll();toast("Reverted. Your original is back.");
 }});
 document.querySelectorAll("[data-regen]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();var c=CMP(),x=IS(c,b.getAttribute("data-regen"));
  startRun([{id:x.id,fx:"Regenerating from the approved product master, then re-checking",n:x.n}],
   "Regenerating \u00b7 "+x.n+" variants");
 }});
 document.querySelectorAll("[data-ok]").forEach(function(b){b.onclick=function(e){
  e.stopPropagation();var c=CMP(),x=IS(c,b.getAttribute("data-ok"));
  S.ovr[c.id].push({t:x.t,r:"Looked, judged fine",a:x.au});dn(c)[x.id]=true;
  say('<p>Noted. <b>'+x.n+' variants</b> cleared on your eyes, not mine. I logged that I flagged it and you disagreed, which is what tunes my threshold.</p>');
  renderAll();toast("Cleared on your judgement");
 }});
 var ix=$("#ix");if(ix)ix.onclick=function(){S.sel=null;renderAll()};
 var zi=$("#zi"),zo=$("#zo"),zf=$("#zf"),z1=$("#z1");
 if(zi)zi.onclick=function(){setZoom(VIEW.z*1.25)};
 if(zo)zo.onclick=function(){setZoom(VIEW.z/1.25)};
 if(zf)zf.onclick=function(){fitView()};
 if(z1)z1.onclick=function(){setZoom(1)};
 var vp=$("#vp");
 if(vp){
  var dg=false,sx=0,sy=0,ox=0,oy=0,mv=false;
  vp.onpointerdown=function(e){
   if(e.target.closest(".insp")||e.target.closest(".fbar")||e.target.closest(".fpill")
     ||e.target.closest(".pinbox")||e.target.closest(".cbub"))return;
   dg=true;mv=false;sx=e.clientX;sy=e.clientY;ox=VIEW.x;oy=VIEW.y;
   vp.classList.add("drag");vp.setPointerCapture(e.pointerId);
  };
  vp.onpointermove=function(e){if(!dg)return;var dx=e.clientX-sx,dy=e.clientY-sy;
   if(Math.abs(dx)>3||Math.abs(dy)>3){if(!mv&&S.pin){S.pin=null;renderMid();wire()}mv=true}
   VIEW.x=ox+dx;VIEW.y=oy+dy;applyView()};
  vp.onpointerup=function(e){dg=false;vp.classList.remove("drag");
   if(!mv){var cd=e.target.closest(".cd");
    if(cd){S.sel=cd.dataset.v;renderAll()}
    else if(!e.target.closest(".insp")){if(S.sel){S.sel=null;renderAll()}}}};
  vp.onwheel=function(e){
   e.preventDefault();
   if(S.pin){S.pin=null;renderMid();wire()}
   if(e.shiftKey){VIEW.x-=e.deltaX;VIEW.y-=e.deltaY;applyView();return}
   setZoom(VIEW.z*(e.deltaY<0?1.09:1/1.09),e.clientX,e.clientY);
  };
  vp.ondblclick=function(e){var cd=e.target.closest(".cd");if(cd){S.sel=cd.dataset.v;renderAll();zoomTo(cd.dataset.v,1.3)}};
 }
}
$("#ship").onclick=function(){
 if(S.nav!=="canvas"){toast("Open a campaign first.");return}
 var c=CMP();
 if(c.mkt==="jp"&&!S.reviewer[c.id]){reviewerModal(c);return}
 var t=tally(c),ov=S.ovr[c.id]||[];
 S.tab="chat";
 say('<p><b>Shipped '+t.g+' of '+c.total+' variants</b> across '+c.plats.length+' platforms.</p>'
  +'<div class="ok">\u2713 '+fixedCount(c)+' variant slots I corrected \u00b7 '
  +Object.keys(dn(c)).length+' findings resolved'+(ov.length?' \u00b7 '+ov.length+' you overrode, reasons on file':'')+'</div>'
  +(t.r||t.a?'<p style="margin-top:8px;font-size:11.5px;color:var(--i2)">'+(t.r+t.a)+' held back. They are still here and nothing about them changed.</p>':'')
  +'<span class="cite">Every change is a visible diff \u00b7 this transcript is the record of who decided what</span>');
 renderAll();toast("Shipped "+t.g+" variants");
};

document.addEventListener("click",function(e){

$("#ci").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();$("#cs").click()}};
renderAll();
